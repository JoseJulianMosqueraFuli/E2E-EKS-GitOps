# GitLab CI Pipeline for MLOps Platform
# NOTE: This is a skeleton — customize to your GitLab setup.

stages:
  - validate
  - test
  - security

variables:
  AWS_REGION: us-east-1

# --- Validation Stage ---

terraform-validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.6
    entrypoint: [""]
  rules:
    - changes:
        - infra/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cd infra/environments/dev
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check -recursive ../../

k8s-validate:
  stage: validate
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  rules:
    - changes:
        - k8s/**/*
        - gitops/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - echo "TODO: Setup kustomize and validate manifests"
    # Exclude CRD files - kubectl cannot validate CRDs without the API server
    - kubectl --dry-run=client apply -k k8s/mlops-stack/mlflow/

helm-lint:
  stage: validate
  image:
    name: alpine/helm:3.14
    entrypoint: [""]
  rules:
    - changes:
        - gitops/charts/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      for chart in gitops/charts/*/; do
        echo "=== Linting $(basename "$chart") ==="
        helm lint "$chart"
        helm template --debug "$chart" > /dev/null
      done

mlops-validate:
  stage: validate
  image: python:3.11-slim
  rules:
    - changes:
        - scripts/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - bash -n scripts/setup-mlops-stack.sh
    - echo "All scripts validated"

# --- Test Stage ---

n8n-workflow-test:
  stage: test
  timeout: 30 minutes
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - changes:
        - n8n/**/*
        - Makefile
        - .gitlab-ci.yml
  before_script:
    - apk add --no-cache bash coreutils jq make
  script:
    - timeout --signal=TERM --kill-after=30s 30m make test-n8n
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - n8n-test-artifacts/

ml-platform-test:
  stage: test
  image: python:3.11-slim
  rules:
    - changes:
        - ml-platform/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cd ml-platform
    - pip install -e ".[dev]"
    - pytest tests/ -v

ml-platform-lint:
  stage: test
  image: python:3.11-slim
  rules:
    - changes:
        - ml-platform/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - cd ml-platform
    - pip install -e ".[dev]"
    - flake8 src/ tests/
    - black --check src/ tests/

# --- Security Stage ---

security-scan:
  stage: security
  image:
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - checkov -d infra/ --framework terraform
