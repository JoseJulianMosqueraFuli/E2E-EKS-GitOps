# CircleCI Configuration for MLOps Platform
# NOTE: This is a skeleton — customize to your CircleCI project.

version: 2.1

executors:
  terraform:
    docker:
      - image: hashicorp/terraform:1.6
  python:
    docker:
      - image: cimg/python:3.11
  n8n:
    docker:
      - image: cimg/base:2025.02@sha256:c4b738db95b65caeb66429913ce5ef53e203ee30bcf050896c9a6694a335b942
  kubectl:
    docker:
      - image: cimg/go:1.21

jobs:
  terraform-validate:
    executor: terraform
    steps:
      - checkout
      - run:
          name: Terraform Init & Validate
          command: |
            cd infra/environments/dev
            terraform init -backend=false
            terraform validate
      - run:
          name: Terraform Format Check
          command: terraform fmt -check -recursive infra/

  k8s-validate:
    executor: kubectl
    steps:
      - checkout
      - run:
          name: Setup kubectl
          command: |
            curl -LO "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
            sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      - run:
          name: Validate Kubernetes Manifests
          command: |
            echo "TODO: Validate k8s manifests against cluster"
            # Exclude CRD files - kubectl cannot validate CRDs without the API server
            kubectl --dry-run=client apply -k k8s/mlops-stack/mlflow/

  helm-lint:
    executor: python
    steps:
      - checkout
      - run:
          name: Setup Helm
          command: |
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - run:
          name: Lint Helm Charts
          command: |
            for chart in gitops/charts/*/; do
              echo "=== Linting $(basename "$chart") ==="
              helm lint "$chart"
              helm template --debug "$chart" > /dev/null
            done

  ml-platform-test:
    executor: python
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            cd ml-platform
            pip install -e ".[dev]"
      - run:
          name: Run Tests
          command: |
            cd ml-platform
            pytest tests/ -v
      - run:
          # NOTE: Lint is allowed to fail - legacy code has many violations.
          # Lint results are visible but do not block the pipeline.
          name: Lint Python (non-blocking)
          command: |
            cd ml-platform
            flake8 src/ tests/
            black --check src/ tests/

  n8n-workflow-test:
    executor: n8n
    steps:
      - checkout
      - run:
          name: Install n8n test dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y jq make
      - setup_remote_docker:
          version: 27.5.1
      - run:
          name: Run n8n tests only for related changes
          command: |
            base_ref=""
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              base_ref="HEAD^"
            elif git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main; then
              base_ref="origin/main"
            fi

            if [ -n "$base_ref" ] && git diff --quiet "$base_ref" HEAD -- n8n Makefile .circleci/config.yml; then
              mkdir -p n8n-test-artifacts
              printf '# n8n workflow test report\n\nSkipped: no n8n-related files changed.\n' > n8n-test-artifacts/n8n-test-report.md
              status=0
            else
              set +e
              timeout --signal=TERM --kill-after=30s 30m make test-n8n
              status=$?
              set -e
            fi
            echo "$status" > /tmp/n8n-workflow-test-status
            exit 0
          no_output_timeout: 30m
      - store_artifacts:
          path: n8n-test-artifacts
          destination: n8n-test-artifacts
      - run:
          name: Return n8n workflow test status
          command: test "$(cat /tmp/n8n-workflow-test-status)" -eq 0

  security-scan:
    executor: python
    steps:
      - checkout
      - run:
          name: Run Checkov Security Scan
          command: |
            pip install checkov
            checkov -d infra/ --framework terraform

workflows:
  ci:
    jobs:
      - terraform-validate
      - k8s-validate
      - helm-lint
      - ml-platform-test
      - n8n-workflow-test
      - security-scan
