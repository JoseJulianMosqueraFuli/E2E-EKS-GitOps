apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: chaos-mlflow-engine-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - litmuschaos.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - chaosengines
  matchConditions:
  - name: workflow-account
    expression: request.userInfo.username == 'system:serviceaccount:argo-workflows:chaos-workflow-mlflow'
  validations:
  - expression: object.spec.chaosServiceAccount == 'litmus-pod-mlflow' && object.spec.appinfo.appns == 'mlflow'
      && object.spec.appinfo.applabel == 'app=mlflow-server' && object.spec.appinfo.appkind == 'deployment' && object.spec.experiments.size()
      == 1 && object.spec.experiments[0].name == 'pod-delete'
    message: The MLflow workflow may only delete MLflow server pods with its dedicated fault account.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: chaos-mlflow-engine-scope
spec:
  policyName: chaos-mlflow-engine-scope
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: chaos-runner-account-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
    - apiGroups:
      - litmuschaos.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - chaosengines
  matchConditions:
  - name: fault-accounts
    expression: request.userInfo.username.startsWith('system:serviceaccount:litmus:litmus-') && request.userInfo.username
      != 'system:serviceaccount:litmus:litmus-chaos-exporter'
  variables:
  - name: account
    expression: request.userInfo.username.split(':')[3]
  - name: pod
    expression: 'request.resource.resource == ''pods'' ? object.spec : (request.resource.resource == ''jobs'' ?
      object.spec.template.spec : null)'
  validations:
  - expression: request.resource.resource != 'pods' || object.spec.serviceAccountName == variables.account
    message: Chaos runner pods must use the requesting fault account.
  - expression: request.resource.resource != 'jobs' || object.spec.template.spec.serviceAccountName == variables.account
    message: Chaos runner jobs must use the requesting fault account.
  - expression: request.resource.resource != 'chaosengines' || object.spec.chaosServiceAccount == variables.account
    message: Chaos runners cannot select a more privileged fault account.
  - expression: '!variables.account.startsWith(''litmus-pod-'') || variables.pod == null || ((!has(variables.pod.hostNetwork)
      || !variables.pod.hostNetwork) && (!has(variables.pod.hostPID) || !variables.pod.hostPID) && (!has(variables.pod.hostIPC)
      || !variables.pod.hostIPC))'
    message: Pod deletion faults cannot use host namespaces.
  - expression: '!variables.account.startsWith(''litmus-pod-'') || variables.pod == null || variables.pod.containers.all(c,
      !has(c.securityContext) || ((!has(c.securityContext.privileged) || !c.securityContext.privileged) && (!has(c.securityContext.capabilities)
      || !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0)))'
    message: Pod deletion faults cannot create privileged containers or add capabilities.
  - expression: '!variables.account.startsWith(''litmus-pod-'') || variables.pod == null || (!has(variables.pod.volumes)
      || variables.pod.volumes.all(v, !has(v.hostPath) && !has(v.secret) && (!has(v.projected) || v.projected.sources.all(s,
      !has(s.secret)))))'
    message: Pod deletion faults cannot mount host paths or secrets.
  - expression: '!variables.account.startsWith(''litmus-pod-'') || variables.pod == null || variables.pod.containers.all(c,
      (!has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef))) && (!has(c.env) || c.env.all(e, !has(e.valueFrom)
      || !has(e.valueFrom.secretKeyRef))))'
    message: Pod deletion faults cannot load secret values into containers.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: chaos-runner-account-scope
spec:
  policyName: chaos-runner-account-scope
  validationActions:
  - Deny
