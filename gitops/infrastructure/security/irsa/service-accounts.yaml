apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
    app.kubernetes.io/part-of: mlops-platform
  annotations:
    eks.amazonaws.com/role-arn: ${alb_irsa_role}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ebs-csi-controller-sa
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-ebs-csi-driver
    app.kubernetes.io/part-of: mlops-platform
  annotations:
    eks.amazonaws.com/role-arn: ${ebs_irsa_role}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cluster-autoscaler
    app.kubernetes.io/part-of: mlops-platform
  annotations:
    eks.amazonaws.com/role-arn: ${ca_irsa_role}
