apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: infrastructure-repo
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/JoseJulianMosqueraFuli/E2E-EKS-GitOps.git
  ref:
    branch: main
  ignore: |
    # Exclude files not needed for deployment
    /**/README.md
    /**/docs/
    /**/.git/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: applications-repo
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/JoseJulianMosqueraFuli/E2E-EKS-GitOps.git
  ref:
    branch: main
  ignore: |
    # Exclude files not needed for deployment
    /**/README.md
    /**/docs/
    /**/.git/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: helm-charts-repo
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/JoseJulianMosqueraFuli/E2E-EKS-GitOps.git
  ref:
    branch: main
