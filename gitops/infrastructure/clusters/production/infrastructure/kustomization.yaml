apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: production-infrastructure
  namespace: flux-system
resources:
- ../../../sources
- ../../../flux-config
patches:
- patch: |
    - op: replace
      path: /spec/interval
      value: 10m
  target:
    kind: GitRepository
- patch: |
    - op: replace
      path: /spec/interval
      value: 10m
  target:
    kind: Kustomization
    namespace: flux-system
- target:
    kind: GitRepository
  patch: |
    - op: replace
      path: /spec/ref/branch
      value: main
commonLabels:
  environment: production
