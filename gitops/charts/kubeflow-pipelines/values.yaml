# Kubeflow Pipelines Helm Chart Values
# Default values for kubeflow-pipelines deployment

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

imageRegistry: "ghcr.io/kubeflow"

# API Server Configuration
apiServer:
  image:
    repository: kfp-api-server
    tag: "2.17.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 250m
      memory: 500Mi
    limits:
      cpu: 500m
      memory: 1Gi

  service:
    type: ClusterIP
    port: 8888

# Frontend Configuration
frontend:
  image:
    repository: kfp-frontend
    tag: "2.17.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 3000

# Persistence Agent Configuration
persistenceAgent:
  image:
    repository: kfp-persistence-agent
    tag: "2.17.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Scheduled Workflow Configuration
scheduledWorkflow:
  image:
    repository: kfp-scheduled-workflow-controller
    tag: "2.17.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Viewer CRD Controller Configuration
viewerCrdController:
  image:
    repository: kfp-viewer-crd-controller
    tag: "2.17.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Visualization Server Configuration
visualizationServer:
  image:
    repository: kfp-visualization-server
    tag: "2.17.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Metadata Writer Configuration
metadataWriter:
  image:
    repository: kfp-metadata-writer
    tag: "2.17.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Cache Server Configuration
cacheServer:
  image:
    repository: kfp-cache-server
    tag: "2.17.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Service Account
serviceAccount:
  create: true
  name: ml-pipeline
  annotations: {}

# MySQL Configuration (Bitnami subchart)
mysql:
  enabled: true
  auth:
    rootPassword: ""
    database: mlpipeline
    username: mlpipeline
    password: ""
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: gp3
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"

# External MySQL configuration (when mysql.enabled=false)
externalMysql:
  host: ""
  port: 3306
  user: mlpipeline
  password: ""
  database: mlpipeline
  existingSecret: ""

# MinIO Configuration (Bitnami subchart)
minio:
  enabled: true
  auth:
    rootUser: minio
    rootPassword: ""
    existingSecret: ""
  persistence:
    enabled: true
    size: 50Gi
    storageClass: gp3
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# External S3 configuration (when minio.enabled=false)
externalS3:
  endpoint: ""
  bucket: mlpipeline
  region: us-east-1
  accessKeyId: ""
  secretAccessKey: ""
  existingSecret: ""

# Ingress configuration
ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: kubeflow.mlops.company.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# RBAC
rbac:
  create: true

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
