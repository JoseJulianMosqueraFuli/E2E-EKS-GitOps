apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ../../../../../platform
namePrefix: dev-
labels:
- pairs:
    environment: dev
  includeSelectors: false
patches:
- patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
  target:
    kind: StatefulSet
    name: prometheus
- patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n"
  target:
    kind: Deployment
    name: grafana
images:
- name: ml-monitoring
  newName: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/mlops-dev-monitoring
replacements:
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_ACCOUNT_ID
  targets:
  - select:
      kind: Deployment
      name: evidently-monitoring
    fieldPaths:
    - spec.template.spec.containers.[name=evidently-monitoring].image
    options:
      delimiter: .
      index: 0
  - select:
      kind: CronJob
      name: drift-detection-job
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=drift-detector].image
    options:
      delimiter: .
      index: 0
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_REGION
  targets:
  - select:
      kind: Deployment
      name: evidently-monitoring
    fieldPaths:
    - spec.template.spec.containers.[name=evidently-monitoring].image
    options:
      delimiter: .
      index: 3
  - select:
      kind: CronJob
      name: drift-detection-job
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=drift-detector].image
    options:
      delimiter: .
      index: 3
