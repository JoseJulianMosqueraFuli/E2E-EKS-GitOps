apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ../../../../../platform
namePrefix: staging-
labels:
- pairs:
    environment: staging
  includeSelectors: false
patches:
- patch: "- op: replace\n  path: /spec/replicas\n  value: 2\n"
  target:
    kind: Deployment
    name: mlflow-server
- patch: "- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/cpu\n\
    \  value: 200m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/memory\n\
    \  value: 512Mi\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/cpu\n\
    \  value: 1000m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/memory\n\
    \  value: 1Gi\n"
  target:
    kind: Deployment
    name: mlflow-server
- patch: "- op: replace\n  path: /data/artifact_root\n  value: s3://mlflow-artifacts-staging\n\
    - op: replace\n  path: /data/s3_endpoint_url\n  value: http://staging-mlflow-minio:9000\n"
  target:
    kind: ConfigMap
    name: mlflow-config
- patch: "- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/cpu\n\
    \  value: 500m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/memory\n\
    \  value: 1Gi\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/cpu\n\
    \  value: 1000m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/memory\n\
    \  value: 2Gi\n"
  target:
    kind: StatefulSet
    name: mlflow-postgresql
- patch: "- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/cpu\n\
    \  value: 200m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/memory\n\
    \  value: 512Mi\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/cpu\n\
    \  value: 1000m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/memory\n\
    \  value: 1Gi\n"
  target:
    kind: Deployment
    name: mlflow-minio
- patch: "- op: replace\n  path: /spec/data/0/remoteRef/key\n  value: mlops/staging/mlflow/database\n\
    - op: replace\n  path: /spec/data/1/remoteRef/key\n  value: mlops/staging/mlflow/database\n\
    - op: replace\n  path: /spec/data/2/remoteRef/key\n  value: mlops/staging/mlflow/database\n"
  target:
    kind: ExternalSecret
    name: mlflow-secrets
- patch: "- op: replace\n  path: /spec/data/0/remoteRef/key\n  value: mlops/staging/mlflow/s3\n\
    - op: replace\n  path: /spec/data/1/remoteRef/key\n  value: mlops/staging/mlflow/s3\n"
  target:
    kind: ExternalSecret
    name: mlflow-minio-secrets
- patch: "- op: replace\n  path: /spec/target/template/data/backend_store_uri\n  value:\
    \ \"postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@staging-mlflow-postgresql:5432/{{\
    \ .database | urlquery }}\"\n"
  target:
    kind: ExternalSecret
    name: mlflow-secrets
images:
- name: mlflow-server
  newName: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/mlops-staging-mlflow-server
- name: mlops-platform
  newName: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/mlops-staging-trainer
replacements:
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_ACCOUNT_ID
  targets:
  - select:
      kind: Deployment
      name: mlflow-server
    fieldPaths:
    - spec.template.spec.containers.[name=mlflow].image
    options:
      delimiter: .
      index: 0
  - select:
      kind: ServiceAccount
    fieldPaths:
    - metadata.annotations.[eks.amazonaws.com/role-arn]
    options:
      delimiter: ':'
      index: 4
  - select:
      kind: CronJob
      name: postgres-backup
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].image
    options:
      delimiter: .
      index: 0
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_REGION
  targets:
  - select:
      kind: Deployment
      name: mlflow-server
    fieldPaths:
    - spec.template.spec.containers.[name=mlflow].image
    options:
      delimiter: .
      index: 3
  - select:
      kind: SecretStore
    fieldPaths:
    - spec.provider.aws.region
  - select:
      kind: CronJob
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].env.[name=AWS_DEFAULT_REGION].value
  - select:
      kind: CronJob
      name: postgres-backup
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].image
    options:
      delimiter: .
      index: 3
