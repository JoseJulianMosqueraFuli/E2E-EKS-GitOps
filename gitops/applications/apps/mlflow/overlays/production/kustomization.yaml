apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ../../../../../platform
namePrefix: prod-
labels:
- pairs:
    environment: production
  includeSelectors: false
patches:
- patch: "- op: replace\n  path: /spec/replicas\n  value: 3\n"
  target:
    kind: Deployment
    name: mlflow-server
- patch: "- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/cpu\n\
    \  value: 500m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/memory\n\
    \  value: 1Gi\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/cpu\n\
    \  value: 2000m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/memory\n\
    \  value: 2Gi\n"
  target:
    kind: Deployment
    name: mlflow-server
- patch: "- op: replace\n  path: /data/artifact_root\n  value: s3://mlflow-artifacts-production\n\
    - op: replace\n  path: /data/s3_endpoint_url\n  value: https://s3.AWS_REGION.amazonaws.com\n"
  target:
    kind: ConfigMap
    name: mlflow-config
- patch: "- op: replace\n  path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage\n\
    \  value: 100Gi\n- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/cpu\n\
    \  value: 1000m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/memory\n\
    \  value: 2Gi\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/cpu\n\
    \  value: 2000m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/memory\n\
    \  value: 4Gi\n"
  target:
    kind: StatefulSet
    name: mlflow-postgresql
- patch: "- op: replace\n  path: /spec/resources/requests/storage\n  value: 200Gi\n"
  target:
    kind: PersistentVolumeClaim
    name: mlflow-minio-pvc
- patch: "- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/cpu\n\
    \  value: 500m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/requests/memory\n\
    \  value: 1Gi\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/cpu\n\
    \  value: 2000m\n- op: replace\n  path: /spec/template/spec/containers/0/resources/limits/memory\n\
    \  value: 2Gi\n"
  target:
    kind: Deployment
    name: mlflow-minio
- patch: "- op: replace\n  path: /spec/refreshInterval\n  value: 30m\n- op: replace\n\
    \  path: /spec/data/0/remoteRef/key\n  value: mlops/production/mlflow/database\n\
    - op: replace\n  path: /spec/data/1/remoteRef/key\n  value: mlops/production/mlflow/database\n\
    - op: replace\n  path: /spec/data/2/remoteRef/key\n  value: mlops/production/mlflow/database\n"
  target:
    kind: ExternalSecret
    name: mlflow-secrets
- patch: "- op: replace\n  path: /spec/refreshInterval\n  value: 30m\n- op: replace\n\
    \  path: /spec/data/0/remoteRef/key\n  value: mlops/production/mlflow/s3\n- op:\
    \ replace\n  path: /spec/data/1/remoteRef/key\n  value: mlops/production/mlflow/s3\n"
  target:
    kind: ExternalSecret
    name: mlflow-minio-secrets
- patch: "- op: replace\n  path: /spec/target/template/data/backend_store_uri\n  value:\
    \ \"postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@prod-mlflow-postgresql:5432/{{\
    \ .database | urlquery }}\"\n"
  target:
    kind: ExternalSecret
    name: mlflow-secrets
- target:
    kind: ServiceAccount
    name: mlflow
  patch: "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: mlflow\n  annotations:\n\
    \    eks.amazonaws.com/role-arn: arn:aws:iam::AWS_ACCOUNT_ID:role/mlops-prod-mlflow\n"
- target:
    kind: ServiceAccount
    name: mlflow-backup-sa
  patch: "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: mlflow-backup-sa\n\
    \  annotations:\n    eks.amazonaws.com/role-arn: arn:aws:iam::AWS_ACCOUNT_ID:role/mlops-prod-backup\n"
- target:
    kind: ServiceAccount
    name: mlflow-secrets
  patch: "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: mlflow-secrets\n\
    \  annotations:\n    eks.amazonaws.com/role-arn: arn:aws:iam::AWS_ACCOUNT_ID:role/mlops-prod-secrets\n"
- target:
    kind: Deployment
    name: mlflow-server
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: mlflow-server\n\
    spec:\n  template:\n    spec:\n      containers:\n        - name: mlflow\n   \
    \       env:\n            - name: AWS_ACCESS_KEY_ID\n              $patch: delete\n\
    \            - name: AWS_SECRET_ACCESS_KEY\n              $patch: delete\n"
images:
- name: mlflow-server
  newName: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/mlops-prod-mlflow-server
- name: mlops-platform
  newName: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/mlops-prod-trainer
replacements:
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_ACCOUNT_ID
  targets:
  - select:
      kind: ConfigMap
      name: platform-resources
    fieldPaths:
    - data.ARTIFACT_BUCKET
    options:
      delimiter: '-'
      index: 4
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_REGION
  targets:
  - select:
      kind: ConfigMap
      name: platform-resources
    fieldPaths:
    - data.ARTIFACT_BUCKET
    options:
      delimiter: '-'
      index: 5
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_ACCOUNT_ID
  targets:
  - select:
      kind: ConfigMap
      name: platform-resources
    fieldPaths:
    - data.CURATED_BUCKET
    options:
      delimiter: '-'
      index: 4
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_REGION
  targets:
  - select:
      kind: ConfigMap
      name: platform-resources
    fieldPaths:
    - data.CURATED_BUCKET
    options:
      delimiter: '-'
      index: 5
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_ACCOUNT_ID
  targets:
  - select:
      kind: ConfigMap
      name: platform-resources
    fieldPaths:
    - data.BACKUP_BUCKET
    options:
      delimiter: '-'
      index: 3
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_REGION
  targets:
  - select:
      kind: ConfigMap
      name: platform-resources
    fieldPaths:
    - data.BACKUP_BUCKET
    options:
      delimiter: '-'
      index: 4
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_ACCOUNT_ID
  targets:
  - select:
      kind: Deployment
      name: mlflow-server
    fieldPaths:
    - spec.template.spec.containers.[name=mlflow].image
    options:
      delimiter: .
      index: 0
  - select:
      kind: ServiceAccount
    fieldPaths:
    - metadata.annotations.[eks.amazonaws.com/role-arn]
    options:
      delimiter: ':'
      index: 4
  - select:
      kind: CronJob
      name: postgres-backup
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].image
    options:
      delimiter: .
      index: 0
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_REGION
  targets:
  - select:
      kind: Deployment
      name: mlflow-server
    fieldPaths:
    - spec.template.spec.containers.[name=mlflow].image
    options:
      delimiter: .
      index: 3
  - select:
      kind: SecretStore
    fieldPaths:
    - spec.provider.aws.region
  - select:
      kind: CronJob
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].env.[name=AWS_DEFAULT_REGION].value
  - select:
      kind: ConfigMap
      name: mlflow-config
    fieldPaths:
    - data.s3_endpoint_url
    options:
      delimiter: .
      index: 1
  - select:
      kind: CronJob
      name: postgres-backup
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].image
    options:
      delimiter: .
      index: 3
- source:
    kind: ConfigMap
    name: platform-resources
    fieldPath: data.BACKUP_BUCKET
  targets:
  - select:
      kind: CronJob
      name: postgres-backup
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].env.[name=S3_BACKUP_BUCKET].value
- source:
    kind: ConfigMap
    name: platform-resources
    fieldPath: data.ARTIFACT_BUCKET
  targets:
  - select:
      kind: ConfigMap
      name: mlflow-config
    fieldPaths:
    - data.artifact_root
    options:
      delimiter: /
      index: 2
configMapGenerator:
- name: platform-resources
  literals:
  - ARTIFACT_BUCKET=mlops-prod-model-artifacts-AWS_ACCOUNT_ID-AWS_REGION
  - CURATED_BUCKET=mlops-prod-curated-data-AWS_ACCOUNT_ID-AWS_REGION
  - BACKUP_BUCKET=mlops-prod-backups-AWS_ACCOUNT_ID-AWS_REGION
  options:
    disableNameSuffixHash: true
    annotations:
      config.kubernetes.io/local-config: 'true'
