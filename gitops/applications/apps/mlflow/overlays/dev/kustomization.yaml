apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ../../../../../platform
namePrefix: dev-
labels:
- pairs:
    environment: dev
  includeSelectors: false
patches:
- patch: "- op: replace\n  path: /spec/replicas\n  value: 2\n"
  target:
    kind: Deployment
    name: mlflow-server
- patch: "- op: replace\n  path: /data/artifact_root\n  value: s3://mlflow-artifacts-dev\n\
    - op: replace\n  path: /data/s3_endpoint_url\n  value: http://dev-mlflow-minio:9000\n"
  target:
    kind: ConfigMap
    name: mlflow-config
- patch: "- op: replace\n  path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage\n\
    \  value: 10Gi\n"
  target:
    kind: StatefulSet
    name: mlflow-postgresql
- patch: "- op: replace\n  path: /spec/resources/requests/storage\n  value: 20Gi\n"
  target:
    kind: PersistentVolumeClaim
    name: mlflow-minio-pvc
- patch: "- op: replace\n  path: /spec/data/0/remoteRef/key\n  value: mlops/dev/mlflow/database\n\
    - op: replace\n  path: /spec/data/1/remoteRef/key\n  value: mlops/dev/mlflow/database\n\
    - op: replace\n  path: /spec/data/2/remoteRef/key\n  value: mlops/dev/mlflow/database\n"
  target:
    kind: ExternalSecret
    name: mlflow-secrets
- patch: "- op: replace\n  path: /spec/data/0/remoteRef/key\n  value: mlops/dev/mlflow/s3\n\
    - op: replace\n  path: /spec/data/1/remoteRef/key\n  value: mlops/dev/mlflow/s3\n"
  target:
    kind: ExternalSecret
    name: mlflow-minio-secrets
- patch: "- op: replace\n  path: /spec/target/template/data/backend_store_uri\n  value:\
    \ \"postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@dev-mlflow-postgresql:5432/{{\
    \ .database | urlquery }}\"\n"
  target:
    kind: ExternalSecret
    name: mlflow-secrets
images:
- name: mlflow-server
  newName: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/mlops-dev-mlflow-server
- name: mlops-platform
  newName: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/mlops-dev-trainer
replacements:
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_ACCOUNT_ID
  targets:
  - select:
      kind: Deployment
      name: mlflow-server
    fieldPaths:
    - spec.template.spec.containers.[name=mlflow].image
    options:
      delimiter: .
      index: 0
  - select:
      kind: ServiceAccount
    fieldPaths:
    - metadata.annotations.[eks.amazonaws.com/role-arn]
    options:
      delimiter: ':'
      index: 4
  - select:
      kind: CronJob
      name: postgres-backup
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].image
    options:
      delimiter: .
      index: 0
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_REGION
  targets:
  - select:
      kind: Deployment
      name: mlflow-server
    fieldPaths:
    - spec.template.spec.containers.[name=mlflow].image
    options:
      delimiter: .
      index: 3
  - select:
      kind: SecretStore
    fieldPaths:
    - spec.provider.aws.region
  - select:
      kind: CronJob
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].env.[name=AWS_DEFAULT_REGION].value
  - select:
      kind: CronJob
      name: postgres-backup
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].image
    options:
      delimiter: .
      index: 3
