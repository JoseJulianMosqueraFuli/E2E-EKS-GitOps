apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../../../../platform

namePrefix: dev-

labels:
  - pairs:
      environment: dev
    includeSelectors: false

patches:
  # MLflow server: 2 replicas for dev (required for realistic Phase 1 chaos testing).
  # HPA already has minReplicas=2, so this aligns the Deployment with the autoscaler.
  - patch: |
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: mlflow-server
  # Dev artifact bucket
  - patch: |
      - op: replace
        path: /data/artifact_root
        value: s3://mlflow-artifacts-dev
      - op: replace
        path: /data/s3_endpoint_url
        value: http://dev-mlflow-minio:9000
    target:
      kind: ConfigMap
      name: mlflow-config
  # Dev PostgreSQL: smaller storage
  - patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi
    target:
      kind: StatefulSet
      name: mlflow-postgresql
  # Dev MinIO: smaller storage
  - patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 20Gi
    target:
      kind: PersistentVolumeClaim
      name: mlflow-minio-pvc
  # Dev ExternalSecret: use dev secret path
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: mlops/dev/mlflow/database
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: mlops/dev/mlflow/database
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: mlops/dev/mlflow/database
    target:
      kind: ExternalSecret
      name: mlflow-secrets
  - patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: mlops/dev/mlflow/s3
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: mlops/dev/mlflow/s3
    target:
      kind: ExternalSecret
      name: mlflow-minio-secrets

  - patch: |
      - op: replace
        path: /spec/target/template/data/backend_store_uri
        value: "postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@dev-mlflow-postgresql:5432/{{ .database | urlquery }}"
    target:
      kind: ExternalSecret
      name: mlflow-secrets

images:
  - name: mlflow-server
    newName: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/mlops-dev-mlflow-server

replacements:
  - source:
      kind: ConfigMap
      name: platform-config
      fieldPath: data.AWS_ACCOUNT_ID
    targets:
      - select:
          kind: Deployment
          name: mlflow-server
        fieldPaths:
          - spec.template.spec.containers.[name=mlflow].image
        options:
          delimiter: "."
          index: 0
      - select:
          kind: ServiceAccount
        fieldPaths:
          - metadata.annotations.[eks.amazonaws.com/role-arn]
        options:
          delimiter: ":"
          index: 4
  - source:
      kind: ConfigMap
      name: platform-config
      fieldPath: data.AWS_REGION
    targets:
      - select:
          kind: Deployment
          name: mlflow-server
        fieldPaths:
          - spec.template.spec.containers.[name=mlflow].image
        options:
          delimiter: "."
          index: 3
      - select:
          kind: SecretStore
        fieldPaths:
          - spec.provider.aws.region
      - select:
          kind: CronJob
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=postgres-backup].env.[name=AWS_DEFAULT_REGION].value
