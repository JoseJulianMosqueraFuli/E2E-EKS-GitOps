apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: backup
spec:
  schedule: 0 2 * * *
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mlflow
            app.kubernetes.io/component: backup-job
        spec:
          serviceAccountName: mlflow-backup-sa
          restartPolicy: Never
          containers:
          - name: postgres-backup
            image: mlops-platform:0.1.0
            command:
            - python
            - -m
            - src.cli
            env:
            - name: PGHOST
              value: mlflow-postgresql
            - name: PGPORT
              value: '5432'
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: mlflow-secrets
                  key: postgres-user
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: mlflow-secrets
                  key: postgres-db
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-secrets
                  key: postgres-password
            - name: S3_BACKUP_BUCKET
              value: mlops-backups
            - name: AWS_DEFAULT_REGION
              value: AWS_REGION
            - name: HOME
              value: /tmp
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 250m
            args:
            - step
            - backup-db
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 8737
            runAsGroup: 8737
            fsGroup: 8737
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 2Gi
      activeDeadlineSeconds: 2400
      backoffLimit: 1
  startingDeadlineSeconds: 3600
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-backup-sa
  namespace: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: backup-service-account
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::AWS_ACCOUNT_ID:role/mlops-backup-role
