apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-minio
  namespace: mlflow
  labels:
    app: mlflow-minio
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: artifact-storage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-minio
  template:
    metadata:
      labels:
        app: mlflow-minio
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/component: artifact-storage
    spec:
      # The S3 gateway does not need to call the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: versity/versitygw:v1.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: api
              protocol: TCP
          env:
            - name: VGW_BACKEND
              value: posix
            - name: VGW_BACKEND_ARG
              value: /data
            - name: VGW_PORT
              value: ":9000"
            - name: VGW_HEALTH
              value: /health
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-minio-secrets
                  key: root-user
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-minio-secrets
                  key: root-password
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: mlflow-minio-pvc
