apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: data-validation-template
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: workflow-template
spec:
  entrypoint: data-validation
  serviceAccountName: argo-workflow
  arguments:
    parameters:
    - name: data-source
      value: s3://mlops-raw-data/input/data.csv
    - name: validation-suite
      value: default
    - name: output-path
      value: s3://mlops-curated-data/validated
    - name: target-column
      value: target
  templates:
  - name: data-validation
    inputs:
      parameters:
      - name: data-source
        default: s3://mlops-raw-data/input/data.csv
      - name: validation-suite
        default: default
      - name: output-path
        default: s3://mlops-curated-data/validated
      - name: target-column
        default: target
    outputs:
      parameters:
      - name: validated-data
        globalName: validated-data
        valueFrom:
          path: /tmp/validated-data.txt
      - name: validation-report
        valueFrom:
          path: /tmp/validation-report.json
    container:
      image: mlops-platform:0.1.0
      command:
      - python
      - -m
      - src.cli
      args:
      - step
      - validate-data
      - --input
      - '{{inputs.parameters.data-source}}'
      - --output-prefix
      - '{{inputs.parameters.output-path}}'
      - --suite
      - '{{inputs.parameters.validation-suite}}'
      - --target
      - '{{inputs.parameters.target-column}}'
      env:
      - name: AWS_DEFAULT_REGION
        value: AWS_REGION
      envFrom:
      - configMapRef:
          name: ml-step-env
          optional: true
      - secretRef:
          name: ml-step-credentials
          optional: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
