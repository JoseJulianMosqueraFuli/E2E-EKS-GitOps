apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: model-deployment-template
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: workflow-template
spec:
  entrypoint: model-deployment
  serviceAccountName: argo-workflow
  arguments:
    parameters:
    - name: model-name
      value: default-model
    - name: model-version
      value: '1'
    - name: deployment-namespace
      value: models
    - name: mlflow-tracking-uri
      value: http://mlflow-server.mlflow:5000
    - name: previous-version
      value: ''
    - name: validation-data
      value: s3://mlops-curated-data/training/data.csv
    - name: verification-timeout
      value: '600'
  templates:
  - name: model-deployment
    inputs:
      parameters:
      - name: model-name
        default: default-model
      - name: model-version
        default: '1'
      - name: deployment-namespace
        default: models
      - name: mlflow-tracking-uri
        default: http://mlflow-server.mlflow:5000
      - name: previous-version
        default: ''
      - name: validation-data
        default: s3://mlops-curated-data/training/data.csv
      - name: verification-timeout
        default: '600'
    dag:
      failFast: false
      tasks:
      - name: roll-out
        template: roll-out-step
        arguments:
          parameters:
          - name: model-name
            value: '{{inputs.parameters.model-name}}'
          - name: deployment-namespace
            value: '{{inputs.parameters.deployment-namespace}}'
          - name: model-version
            value: '{{inputs.parameters.model-version}}'
      - name: verify
        template: validate-deployment-step
        depends: roll-out
        arguments:
          parameters:
          - name: model-name
            value: '{{inputs.parameters.model-name}}'
          - name: model-version
            value: '{{inputs.parameters.model-version}}'
          - name: deployment-namespace
            value: '{{inputs.parameters.deployment-namespace}}'
          - name: mlflow-tracking-uri
            value: '{{inputs.parameters.mlflow-tracking-uri}}'
          - name: validation-data
            value: '{{inputs.parameters.validation-data}}'
          - name: timeout
            value: '{{inputs.parameters.verification-timeout}}'
      - name: restore-champion
        template: set-alias-step
        depends: roll-out.Failed || roll-out.Errored || verify.Failed || verify.Errored
        arguments:
          parameters:
          - name: model-name
            value: '{{inputs.parameters.model-name}}'
          - name: version
            value: '{{inputs.parameters.previous-version}}'
          - name: mlflow-tracking-uri
            value: '{{inputs.parameters.mlflow-tracking-uri}}'
      - name: roll-back
        template: roll-out-step
        depends: restore-champion
        when: "'{{inputs.parameters.previous-version}}' != ''"
        arguments:
          parameters:
          - name: model-name
            value: '{{inputs.parameters.model-name}}'
          - name: deployment-namespace
            value: '{{inputs.parameters.deployment-namespace}}'
          - name: model-version
            value: '{{inputs.parameters.previous-version}}'
      - name: verify-rollback
        template: validate-deployment-step
        depends: roll-back
        when: "'{{inputs.parameters.previous-version}}' != ''"
        arguments:
          parameters:
          - name: model-name
            value: '{{inputs.parameters.model-name}}'
          - name: model-version
            value: '{{inputs.parameters.previous-version}}'
          - name: deployment-namespace
            value: '{{inputs.parameters.deployment-namespace}}'
          - name: mlflow-tracking-uri
            value: '{{inputs.parameters.mlflow-tracking-uri}}'
          - name: validation-data
            value: '{{inputs.parameters.validation-data}}'
          - name: timeout
            value: '{{inputs.parameters.verification-timeout}}'
      - name: reject-candidate
        template: reject-candidate-step
        depends: restore-champion.Succeeded || restore-champion.Failed || restore-champion.Errored
        arguments:
          parameters:
          - name: model-name
            value: '{{inputs.parameters.model-name}}'
          - name: model-version
            value: '{{inputs.parameters.model-version}}'
          - name: previous-version
            value: '{{inputs.parameters.previous-version}}'
  - name: roll-out-step
    inputs:
      parameters:
      - name: model-name
      - name: deployment-namespace
      - name: model-version
    resource:
      action: patch
      mergeStrategy: merge
      manifest: |
        apiVersion: serving.kserve.io/v1beta1
        kind: InferenceService
        metadata:
          name: "{{inputs.parameters.model-name}}"
          namespace: "{{inputs.parameters.deployment-namespace}}"
        spec:
          predictor:
            annotations:
              mlops-platform/model-version: "{{inputs.parameters.model-version}}"
  - name: validate-deployment-step
    inputs:
      parameters:
      - name: model-name
      - name: model-version
      - name: deployment-namespace
      - name: mlflow-tracking-uri
      - name: validation-data
      - name: timeout
    container:
      image: mlops-platform:0.1.0
      command:
      - python
      - -m
      - src.cli
      args:
      - step
      - validate-deployment
      - --url
      - http://{{inputs.parameters.model-name}}-predictor.{{inputs.parameters.deployment-namespace}}.svc.cluster.local/invocations
      - --data-uri
      - '{{inputs.parameters.validation-data}}'
      - --model-uri
      - models:/{{inputs.parameters.model-name}}/{{inputs.parameters.model-version}}
      - --expected-version
      - '{{inputs.parameters.model-version}}'
      - --timeout
      - '{{inputs.parameters.timeout}}'
      env:
      - name: MLFLOW_TRACKING_URI
        value: '{{inputs.parameters.mlflow-tracking-uri}}'
      - name: AWS_DEFAULT_REGION
        value: AWS_REGION
      envFrom:
      - configMapRef:
          name: ml-step-env
          optional: true
      - secretRef:
          name: ml-step-credentials
          optional: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
  - name: set-alias-step
    inputs:
      parameters:
      - name: model-name
      - name: version
      - name: mlflow-tracking-uri
    container:
      image: mlops-platform:0.1.0
      command:
      - python
      - -m
      - src.cli
      args:
      - step
      - set-alias
      - --model-name
      - '{{inputs.parameters.model-name}}'
      - --version
      - '{{inputs.parameters.version}}'
      env:
      - name: MLFLOW_TRACKING_URI
        value: '{{inputs.parameters.mlflow-tracking-uri}}'
      - name: AWS_DEFAULT_REGION
        value: AWS_REGION
      envFrom:
      - configMapRef:
          name: ml-step-env
          optional: true
      - secretRef:
          name: ml-step-credentials
          optional: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
  - name: reject-candidate-step
    inputs:
      parameters:
      - name: model-name
      - name: model-version
      - name: previous-version
    container:
      image: mlops-platform:0.1.0
      command:
      - sh
      - -c
      args:
      - echo "${MODEL_NAME} v${MODEL_VERSION} failed the deployment gate; @champion returned to '${PREVIOUS_VERSION}'" >&2; exit 1
      env:
      - name: MODEL_NAME
        value: '{{inputs.parameters.model-name}}'
      - name: MODEL_VERSION
        value: '{{inputs.parameters.model-version}}'
      - name: PREVIOUS_VERSION
        value: '{{inputs.parameters.previous-version}}'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
