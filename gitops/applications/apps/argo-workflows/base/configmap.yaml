apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: workflow-controller
data:
  config: |
    executor:
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    workflowDefaults:
      spec:
        serviceAccountName: argo-workflow
        securityContext:
          runAsNonRoot: true
          runAsUser: 8737
    links:
    - name: MLflow Experiments
      scope: workflow
      url: http://mlflow-server.mlflow:5000/#/experiments
    - name: Workflow Logs
      scope: pod-logs
      url: http://grafana.monitoring:3000/explore
    metricsConfig:
      enabled: true
      path: /metrics
      port: 9090
      secure: true
    telemetryConfig:
      enabled: false
