apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kserve
  namespace: kserve
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/kserve/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-crd
  namespace: kserve
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: kserve-crd
      version: v0.21.0
      sourceRef:
        kind: HelmRepository
        name: kserve
      interval: 1h
  releaseName: kserve-crd
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve
  namespace: kserve
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: kserve-crd
    - name: cert-manager
      namespace: flux-system
  chart:
    spec:
      chart: kserve-resources
      version: v0.21.0
      sourceRef:
        kind: HelmRepository
        name: kserve
      interval: 1h
  releaseName: kserve
  values:
    kserve:
      controller:
        deploymentMode: Standard
        imagePullPolicy: IfNotPresent
        gateway:
          disableIngressCreation: true
