apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mlflow-resilience-test
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: mlflow-resilience-test
    app.kubernetes.io/component: chaos-validation
spec:
  serviceAccountName: chaos-workflow
  entrypoint: resilience-test
  onExit: stop-chaos
  activeDeadlineSeconds: 600
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  arguments:
    parameters:
    - name: mlflow-url
      value: http://mlflow-server.mlflow:5000
    - name: mlflow-deployment
      value: mlflow-server
    - name: expected-replicas
      value: '2'
    - name: chaos-duration
      value: '60'
    - name: max-acceptable-downtime-seconds
      value: '5'
  templates:
  - name: resilience-test
    steps:
    - - name: pre-check
        template: mlflow-health-check
    - - name: prepare-canary
        template: prepare-canary
    - - name: run-chaos
        template: run-pod-delete
      - name: monitor-during-chaos
        template: continuous-health-check
        arguments:
          parameters:
          - name: run-id
            value: '{{steps.prepare-canary.outputs.parameters.run-id}}'
    - - name: post-check
        template: mlflow-health-check
    - - name: log-test-run
        template: mlflow-log-run
    - - name: verify-canary
        template: verify-canary
        arguments:
          parameters:
          - name: run-id
            value: '{{steps.prepare-canary.outputs.parameters.run-id}}'
    - - name: report
        template: report-results
        arguments:
          parameters:
          - name: downtime
            value: '{{steps.monitor-during-chaos.outputs.parameters.max-downtime}}'
  - name: mlflow-health-check
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.mlflow-url}}/health'
      - name: MLFLOW_DEPLOYMENT
        value: '{{workflow.parameters.mlflow-deployment}}'
      - name: EXPECTED_REPLICAS
        value: '{{workflow.parameters.expected-replicas}}'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: 'set -eu

        . /chaos/common.sh

        validate_parameters

        require_uint expected-replicas "$EXPECTED_REPLICAS" 2 100

        kubectl --request-timeout=130s rollout status deployment/"$MLFLOW_DEPLOYMENT" -n mlflow --timeout=120s

        ready=$(kubectl --request-timeout=10s get deployment "$MLFLOW_DEPLOYMENT" -n mlflow -o jsonpath=''{.status.readyReplicas}'')

        [ "${ready:-0}" -ge "$EXPECTED_REPLICAS" ] || { echo "ERROR: insufficient ready replicas" >&2; exit 1; }

        code=$(curl -s -o /dev/null -w ''%{http_code}'' --max-time 5 "$PROBE_URL") || code=000

        [ "$code" = 200 ] || { echo "ERROR: /health returned $code" >&2; exit 1; }

        echo "OK: $ready replicas ready and /health is 200"

        '
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: run-pod-delete
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.mlflow-url}}/health'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: "set -eu\n. /chaos/common.sh\nvalidate_parameters\nwait_for_probe\nengine=\"{{workflow.name}}\"\n\
        cat <<EOF | kubectl --request-timeout=10s create -f -\napiVersion: litmuschaos.io/v1alpha1\nkind: ChaosEngine\n\
        metadata:\n  name: ${engine}\n  namespace: litmus\n  labels:\n    app.kubernetes.io/component: chaos-experiment\n\
        \    chaos.mlops-platform/workflow: \"{{workflow.name}}\"\nspec:\n  appinfo:\n    appns: \"mlflow\"\n  \
        \  applabel: \"app=mlflow-server\"\n    appkind: \"deployment\"\n  engineState: \"active\"\n  jobCleanUpPolicy:\
        \ \"delete\"\n  chaosServiceAccount: litmus-pod-mlflow\n  experiments:\n    - name: pod-delete\n      spec:\n\
        \        components:\n          env:\n            - name: TOTAL_CHAOS_DURATION\n              value: \"\
        ${CHAOS_DURATION}\"\n            - name: CHAOS_INTERVAL\n              value: \"10\"\n            - name:\
        \ FORCE\n              value: \"false\"\n            - name: PODS_AFFECTED_PERC\n              value: \"\
        50\"\nEOF\ntimeout=$(( ${CHAOS_DURATION} + 180 ))\nkubectl wait chaosengine/\"$engine\" -n litmus \\\n \
        \ --for=jsonpath='{.status.engineStatus}'=completed --timeout=\"${timeout}s\"\nverdict=$(kubectl get chaosresult\
        \ \"${engine}-pod-delete\" -n litmus \\\n  -o jsonpath='{.status.experimentStatus.verdict}')\necho \"Litmus\
        \ verdict: $verdict\"\n[ \"$verdict\" = \"Pass\" ]\n"
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: continuous-health-check
    outputs:
      parameters:
      - name: max-downtime
        valueFrom:
          path: /tmp/max_downtime.txt
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: 'sh /chaos/monitor.sh

        '
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.mlflow-url}}/health'
      - name: EXPECTED_ENGINES
        value: '1'
      - name: CANARY_RUN_ID
        value: '{{inputs.parameters.run-id}}'
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
    inputs:
      parameters:
      - name: run-id
  - name: mlflow-log-run
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.mlflow-url}}/health'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: "set -eu\napi=\"{{workflow.parameters.mlflow-url}}/api/2.0/mlflow\"\nnow=$(( $(date +%s) * 1000 ))\n\
        run_id=$(curl -sf --max-time 10 -X POST \"$api/runs/create\" -H 'Content-Type: application/json' \\\n  -d\
        \ \"{\\\"experiment_id\\\": \\\"0\\\", \\\"run_name\\\": \\\"chaos-resilience-test\\\", \\\"start_time\\\
        \": $now, \\\"tags\\\": [{\\\"key\\\": \\\"workflow\\\", \\\"value\\\": \\\"{{workflow.name}}\\\"}]}\" \\\
        \n  | jq -r '.run.info.run_id')\ncurl -sf --max-time 10 -X POST \"$api/runs/log-metric\" -H 'Content-Type:\
        \ application/json' \\\n  -d \"{\\\"run_id\\\": \\\"$run_id\\\", \\\"key\\\": \\\"value\\\", \\\"value\\\
        \": 1.0, \\\"timestamp\\\": $now}\"\ncurl -sf --max-time 10 -X POST \"$api/runs/update\" -H 'Content-Type:\
        \ application/json' \\\n  -d \"{\\\"run_id\\\": \\\"$run_id\\\", \\\"status\\\": \\\"FINISHED\\\", \\\"\
        end_time\\\": $now}\"\necho \"MLflow run $run_id logged successfully after chaos\"\n"
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: report-results
    inputs:
      parameters:
      - name: downtime
    script:
      image: curlimages/curl:8.22.0
      command:
      - sh
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: "echo \"=== MLflow Resilience Test Report ===\"\necho \"Workflow: {{workflow.name}}\"\necho \"Max\
        \ consecutive /health failures: {{inputs.parameters.downtime}} seconds\"\nif [ \"{{inputs.parameters.downtime}}\"\
        \ -gt \"{{workflow.parameters.max-acceptable-downtime-seconds}}\" ]; then\n  echo \"RESULT: FAIL (downtime\
        \ > {{workflow.parameters.max-acceptable-downtime-seconds}}s)\"\n  exit 1\nfi\necho \"RESULT: PASS (downtime\
        \ <= {{workflow.parameters.max-acceptable-downtime-seconds}}s)\"\n"
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.mlflow-url}}/health'
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: stop-chaos
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.mlflow-url}}/health'
      - name: CLEANUP_NODE_TAINTS
        value: 'false'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: 'sh /chaos/cleanup.sh

        '
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: prepare-canary
    container:
      image: mlops-platform:0.1.0
      command:
      - python
      - -m
      - src.cli
      args:
      - step
      - chaos-canary
      - --phase
      - prepare
      - --workflow
      - '{{workflow.name}}'
      env:
      - name: MLFLOW_TRACKING_URI
        value: '{{workflow.parameters.mlflow-url}}'
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
    outputs:
      parameters:
      - name: run-id
        valueFrom:
          path: /tmp/canary-run-id.txt
  - name: verify-canary
    container:
      image: mlops-platform:0.1.0
      command:
      - python
      - -m
      - src.cli
      args:
      - step
      - chaos-canary
      - --phase
      - verify
      - --workflow
      - '{{workflow.name}}'
      - --run-id
      - '{{inputs.parameters.run-id}}'
      env:
      - name: MLFLOW_TRACKING_URI
        value: '{{workflow.parameters.mlflow-url}}'
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
    inputs:
      parameters:
      - name: run-id
  synchronization:
    mutexes:
    - name: chaos-experiments
  volumes:
  - name: chaos-scripts
    configMap:
      name: chaos-workflow-scripts
  podMetadata:
    annotations:
      sidecar.istio.io/inject: 'false'
