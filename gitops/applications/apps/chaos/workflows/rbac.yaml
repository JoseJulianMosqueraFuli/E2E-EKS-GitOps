apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-workflow
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: chaos-workflow
    app.kubernetes.io/component: chaos-validation
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-workflow-executor
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: chaos-workflow
    app.kubernetes.io/component: chaos-validation
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-workflow-executor
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: chaos-workflow
    app.kubernetes.io/component: chaos-validation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-workflow-executor
subjects:
  - kind: ServiceAccount
    name: chaos-workflow
    namespace: argo-workflows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-workflow-engines
  namespace: litmus
  labels:
    app.kubernetes.io/name: chaos-workflow
    app.kubernetes.io/component: chaos-validation
rules:
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosresults"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-workflow-engines
  namespace: litmus
  labels:
    app.kubernetes.io/name: chaos-workflow
    app.kubernetes.io/component: chaos-validation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-workflow-engines
subjects:
  - kind: ServiceAccount
    name: chaos-workflow
    namespace: argo-workflows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-workflow
  labels:
    app.kubernetes.io/name: chaos-workflow
    app.kubernetes.io/component: chaos-validation
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  # az-failure-test lists nodes per zone and removes its own taint on exit
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-workflow
  labels:
    app.kubernetes.io/name: chaos-workflow
    app.kubernetes.io/component: chaos-validation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-workflow
subjects:
  - kind: ServiceAccount
    name: chaos-workflow
    namespace: argo-workflows
