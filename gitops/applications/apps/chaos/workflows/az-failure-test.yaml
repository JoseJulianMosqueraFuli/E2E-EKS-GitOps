apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: az-failure-test
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: az-failure-test
    app.kubernetes.io/component: chaos-validation
spec:
  serviceAccountName: chaos-workflow-node
  entrypoint: az-failure
  onExit: cleanup
  activeDeadlineSeconds: 900
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  tolerations:
  - key: chaos.litmuschaos.io/az-failure
    operator: Exists
    effect: NoExecute
  arguments:
    parameters:
    - name: zone
      value: ''
    - name: chaos-duration
      value: '300'
    - name: probe-url
      value: ''
    - name: max-acceptable-downtime-seconds
      value: '10'
    - name: confirm-zone-failure
      value: 'false'
    - name: probe-body
      value: ''
    - name: probe-response-filter
      value: ''
  templates:
  - name: az-failure
    steps:
    - - name: pre-check
        template: select-nodes
    - - name: taint-node
        template: run-node-taint
        arguments:
          parameters:
          - name: node
            value: '{{item.node}}'
          - name: index
            value: '{{item.index}}'
        withParam: '{{steps.pre-check.outputs.parameters.nodes}}'
      - name: monitor-during-chaos
        template: continuous-probe
        arguments:
          parameters:
          - name: expected-engines
            value: '{{steps.pre-check.outputs.parameters.node-count}}'
    - - name: post-check
        template: verify-recovery
    - - name: report
        template: report-results
        arguments:
          parameters:
          - name: downtime
            value: '{{steps.monitor-during-chaos.outputs.parameters.max-downtime}}'
  - name: select-nodes
    outputs:
      parameters:
      - name: nodes
        valueFrom:
          path: /tmp/nodes.json
      - name: node-count
        valueFrom:
          path: /tmp/node-count.txt
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: KUBECONFIG
        value: /chaos/kubeconfig
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: ZONE
        value: '{{workflow.parameters.zone}}'
      - name: CONFIRM_ZONE_FAILURE
        value: '{{workflow.parameters.confirm-zone-failure}}'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: |
        set -eu
        . /chaos/common.sh
        validate_parameters
        [ -n "$PROBE_BODY" ] && [ -n "$PROBE_RESPONSE_FILTER" ] || { echo "ERROR: prediction request and response assertion are required" >&2; exit 1; }
        [ "$CONFIRM_ZONE_FAILURE" = true ] || { echo "ERROR: confirm-zone-failure=true is required" >&2; exit 1; }
        [ -n "$ZONE" ] || { echo "ERROR: zone is required" >&2; exit 1; }
        kubectl --request-timeout=10s get nodes -o json > /tmp/cluster-nodes.json
        jq -ec --arg zone "$ZONE" '[.items[] | select(.metadata.labels["topology.kubernetes.io/zone"] == $zone)] |
          to_entries | map({node: .value.metadata.name, index: (.key | tostring)})' /tmp/cluster-nodes.json > /tmp/nodes.json
        in_zone=$(jq length /tmp/nodes.json)
        require_uint target-node-count "$in_zone" 1 20
        remaining=$(jq --arg zone "$ZONE" '[.items[] |
          select(.metadata.labels["topology.kubernetes.io/zone"] != null and .metadata.labels["topology.kubernetes.io/zone"] != $zone) |
          select(.spec.unschedulable != true) |
          select(any(.status.conditions[]?; .type == "Ready" and .status == "True")) |
          select(all(.spec.taints[]?; .effect != "NoSchedule" and .effect != "NoExecute"))] | length' /tmp/cluster-nodes.json)
        [ "$remaining" -gt 0 ] || { echo "ERROR: no Ready schedulable node in another zone" >&2; exit 1; }
        jq -e 'all(.items[].spec.taints[]?; .key != "chaos.litmuschaos.io/az-failure")' /tmp/cluster-nodes.json > /dev/null
        for namespace in litmus argo-workflows; do
          kubectl --request-timeout=10s get pods -n "$namespace" -o json > /tmp/control-pods.json
          jq -e --slurpfile targets /tmp/nodes.json 'all(.items[] |
            select(.status.phase != "Succeeded" and .status.phase != "Failed");
            .spec.nodeName as $node | all($targets[0][]; .node != $node))' /tmp/control-pods.json > /dev/null || {
            echo "ERROR: $namespace has control or workflow pods in the target zone" >&2
            exit 1
          }
        done
        sh /chaos/az-safety.sh
        echo "$in_zone" > /tmp/node-count.txt
        echo "Target nodes: $in_zone; surviving Ready nodes: $remaining"
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: run-node-taint
    inputs:
      parameters:
      - name: node
      - name: index
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: KUBECONFIG
        value: /chaos/kubeconfig
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: |
        set -eu
        . /chaos/common.sh
        validate_parameters
        wait_for_probe
        engine="{{workflow.name}}-{{inputs.parameters.index}}"
        cat <<EOF | kubectl --request-timeout=10s create -f -
        apiVersion: litmuschaos.io/v1alpha1
        kind: ChaosEngine
        metadata:
          name: ${engine}
          namespace: litmus
          labels:
            app.kubernetes.io/component: chaos-experiment
            chaos.mlops-platform/workflow: "{{workflow.name}}"
        spec:
          annotationCheck: "false"
          engineState: "active"
          jobCleanUpPolicy: "delete"
          chaosServiceAccount: litmus-node
          components:
            runner:
              tolerations:
                - key: chaos.litmuschaos.io/az-failure
                  operator: Exists
                  effect: NoExecute
          experiments:
            - name: node-taint
              spec:
                components:
                  tolerations:
                    - key: chaos.litmuschaos.io/az-failure
                      operator: Exists
                      effect: NoExecute
                  env:
                    - name: TARGET_NODE
                      value: "{{inputs.parameters.node}}"
                    - name: TAINTS
                      value: "chaos.litmuschaos.io/az-failure=${WORKFLOW_NAME}:NoExecute"
                    - name: TOTAL_CHAOS_DURATION
                      value: "${CHAOS_DURATION}"
                    - name: DEFAULT_HEALTH_CHECK
                      value: "false"
        EOF
        timeout=$(( ${CHAOS_DURATION} + 240 ))
        kubectl wait chaosengine/"$engine" -n litmus \
          --for=jsonpath='{.status.engineStatus}'=completed --timeout="${timeout}s"
        verdict=$(kubectl get chaosresult "${engine}-node-taint" -n litmus \
          -o jsonpath='{.status.experimentStatus.verdict}')
        echo "Litmus verdict for {{inputs.parameters.node}}: $verdict"
        [ "$verdict" = "Pass" ]
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: continuous-probe
    outputs:
      parameters:
      - name: max-downtime
        valueFrom:
          path: /tmp/max_downtime.txt
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: |
        sh /chaos/monitor.sh
      env:
      - name: HOME
        value: /tmp
      - name: KUBECONFIG
        value: /chaos/kubeconfig
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: EXPECTED_ENGINES
        value: '{{inputs.parameters.expected-engines}}'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
    inputs:
      parameters:
      - name: expected-engines
  - name: verify-recovery
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: KUBECONFIG
        value: /chaos/kubeconfig
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: |
        set -eu
        zone="{{workflow.parameters.zone}}"
        tainted=$(kubectl get nodes -l "topology.kubernetes.io/zone=$zone" -o json \
          | jq '[.items[] | select(any(.spec.taints[]?; .key == "chaos.litmuschaos.io/az-failure"))] | length')
        not_ready=$(kubectl get nodes -o json \
          | jq '[.items[] | select(any(.status.conditions[]; .type == "Ready" and .status != "True"))] | length')
        echo "Nodes still tainted in $zone: $tainted; NotReady nodes: $not_ready"
        [ "$tainted" -eq 0 ] && [ "$not_ready" -eq 0 ]
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: report-results
    inputs:
      parameters:
      - name: downtime
    script:
      image: curlimages/curl:8.22.0
      command:
      - sh
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: |
        echo "=== AZ Failure Test Report ==="
        echo "Workflow: {{workflow.name}}"
        echo "Zone: {{workflow.parameters.zone}}"
        echo "Max consecutive probe failures: {{inputs.parameters.downtime}} seconds"
        if [ "{{inputs.parameters.downtime}}" -gt "{{workflow.parameters.max-acceptable-downtime-seconds}}" ]; then
          echo "RESULT: FAIL (downtime > {{workflow.parameters.max-acceptable-downtime-seconds}}s)"
          exit 1
        fi
        echo "RESULT: PASS (downtime <= {{workflow.parameters.max-acceptable-downtime-seconds}}s)"
      env:
      - name: HOME
        value: /tmp
      - name: KUBECONFIG
        value: /chaos/kubeconfig
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: cleanup
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: KUBECONFIG
        value: /chaos/kubeconfig
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: CLEANUP_NODE_TAINTS
        value: 'true'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: |
        sh /chaos/cleanup.sh
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  synchronization:
    mutexes:
    - name: chaos-experiments
  volumes:
  - name: chaos-scripts
    configMap:
      name: chaos-workflow-scripts
  podMetadata:
    annotations:
      sidecar.istio.io/inject: 'false'
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/zone
            operator: Exists
          - key: topology.kubernetes.io/zone
            operator: NotIn
            values:
            - '{{workflow.parameters.zone}}'
