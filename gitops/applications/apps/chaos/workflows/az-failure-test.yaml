apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: az-failure-test
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: az-failure-test
    app.kubernetes.io/component: chaos-validation
spec:
  serviceAccountName: chaos-workflow
  entrypoint: az-failure
  onExit: cleanup
  activeDeadlineSeconds: 900
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  tolerations:
  - key: chaos.litmuschaos.io/az-failure
    operator: Exists
    effect: NoExecute
  arguments:
    parameters:
    - name: zone
      value: ''
    - name: chaos-duration
      value: '300'
    - name: probe-url
      value: ''
    - name: max-acceptable-downtime-seconds
      value: '10'
    - name: confirm-zone-failure
      value: 'false'
    - name: probe-body
      value: ''
    - name: probe-response-filter
      value: ''
  templates:
  - name: az-failure
    steps:
    - - name: pre-check
        template: select-nodes
    - - name: taint-node
        template: run-node-taint
        arguments:
          parameters:
          - name: node
            value: '{{item.node}}'
          - name: index
            value: '{{item.index}}'
        withParam: '{{steps.pre-check.outputs.parameters.nodes}}'
      - name: monitor-during-chaos
        template: continuous-probe
        arguments:
          parameters:
          - name: expected-engines
            value: '{{steps.pre-check.outputs.parameters.node-count}}'
    - - name: post-check
        template: verify-recovery
    - - name: report
        template: report-results
        arguments:
          parameters:
          - name: downtime
            value: '{{steps.monitor-during-chaos.outputs.parameters.max-downtime}}'
  - name: select-nodes
    outputs:
      parameters:
      - name: nodes
        valueFrom:
          path: /tmp/nodes.json
      - name: node-count
        valueFrom:
          path: /tmp/node-count.txt
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: ZONE
        value: '{{workflow.parameters.zone}}'
      - name: CONFIRM_ZONE_FAILURE
        value: '{{workflow.parameters.confirm-zone-failure}}'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: "set -eu\n. /chaos/common.sh\nvalidate_parameters\n[ \"$CONFIRM_ZONE_FAILURE\" = true ] || { echo\
        \ \"ERROR: confirm-zone-failure=true is required\" >&2; exit 1; }\n[ -n \"$ZONE\" ] || { echo \"ERROR: zone\
        \ is required\" >&2; exit 1; }\nkubectl --request-timeout=10s get nodes -o json > /tmp/cluster-nodes.json\n\
        jq -ec --arg zone \"$ZONE\" '[.items[] | select(.metadata.labels[\"topology.kubernetes.io/zone\"] == $zone)]\
        \ |\n  to_entries | map({node: .value.metadata.name, index: (.key | tostring)})' /tmp/cluster-nodes.json\
        \ > /tmp/nodes.json\nin_zone=$(jq length /tmp/nodes.json)\nrequire_uint target-node-count \"$in_zone\" 1\
        \ 20\nremaining=$(jq --arg zone \"$ZONE\" '[.items[] |\n  select(.metadata.labels[\"topology.kubernetes.io/zone\"\
        ] != null and .metadata.labels[\"topology.kubernetes.io/zone\"] != $zone) |\n  select(.spec.unschedulable\
        \ != true) |\n  select(any(.status.conditions[]?; .type == \"Ready\" and .status == \"True\")) |\n  select(all(.spec.taints[]?;\
        \ .effect != \"NoSchedule\" and .effect != \"NoExecute\"))] | length' /tmp/cluster-nodes.json)\n[ \"$remaining\"\
        \ -gt 0 ] || { echo \"ERROR: no Ready schedulable node in another zone\" >&2; exit 1; }\njq -e 'all(.items[].spec.taints[]?;\
        \ .key != \"chaos.litmuschaos.io/az-failure\")' /tmp/cluster-nodes.json > /dev/null\nfor namespace in litmus\
        \ argo-workflows; do\n  kubectl --request-timeout=10s get pods -n \"$namespace\" -o json > /tmp/control-pods.json\n\
        \  jq -e --slurpfile targets /tmp/nodes.json 'all(.items[] |\n    select(.status.phase != \"Succeeded\"\
        \ and .status.phase != \"Failed\");\n    .spec.nodeName as $node | all($targets[0][]; .node != $node))'\
        \ /tmp/control-pods.json > /dev/null || {\n    echo \"ERROR: $namespace has control or workflow pods in\
        \ the target zone\" >&2\n    exit 1\n  }\ndone\necho \"$in_zone\" > /tmp/node-count.txt\necho \"Target nodes:\
        \ $in_zone; surviving Ready nodes: $remaining\"\n"
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: run-node-taint
    inputs:
      parameters:
      - name: node
      - name: index
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: "set -eu\n. /chaos/common.sh\nvalidate_parameters\nwait_for_probe\nengine=\"{{workflow.name}}-{{inputs.parameters.index}}\"\
        \ncat <<EOF | kubectl --request-timeout=10s create -f -\napiVersion: litmuschaos.io/v1alpha1\nkind: ChaosEngine\n\
        metadata:\n  name: ${engine}\n  namespace: litmus\n  labels:\n    app.kubernetes.io/component: chaos-experiment\n\
        \    chaos.mlops-platform/workflow: \"{{workflow.name}}\"\nspec:\n  engineState: \"active\"\n  jobCleanUpPolicy:\
        \ \"delete\"\n  chaosServiceAccount: litmus-node\n  components:\n    runner:\n      tolerations:\n     \
        \   - key: chaos.litmuschaos.io/az-failure\n          operator: Exists\n          effect: NoExecute\n  experiments:\n\
        \    - name: node-taint\n      spec:\n        components:\n          tolerations:\n            - key: chaos.litmuschaos.io/az-failure\n\
        \              operator: Exists\n              effect: NoExecute\n          env:\n            - name: TARGET_NODE\n\
        \              value: \"{{inputs.parameters.node}}\"\n            - name: TAINTS\n              value: \"\
        chaos.litmuschaos.io/az-failure=${WORKFLOW_NAME}:NoExecute\"\n            - name: TOTAL_CHAOS_DURATION\n\
        \              value: \"${CHAOS_DURATION}\"\n            - name: DEFAULT_HEALTH_CHECK\n              value:\
        \ \"false\"\nEOF\ntimeout=$(( ${CHAOS_DURATION} + 240 ))\nkubectl wait chaosengine/\"$engine\" -n litmus\
        \ \\\n  --for=jsonpath='{.status.engineStatus}'=completed --timeout=\"${timeout}s\"\nverdict=$(kubectl get\
        \ chaosresult \"${engine}-node-taint\" -n litmus \\\n  -o jsonpath='{.status.experimentStatus.verdict}')\n\
        echo \"Litmus verdict for {{inputs.parameters.node}}: $verdict\"\n[ \"$verdict\" = \"Pass\" ]\n"
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: continuous-probe
    outputs:
      parameters:
      - name: max-downtime
        valueFrom:
          path: /tmp/max_downtime.txt
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: 'sh /chaos/monitor.sh

        '
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: EXPECTED_ENGINES
        value: '{{inputs.parameters.expected-engines}}'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
    inputs:
      parameters:
      - name: expected-engines
  - name: verify-recovery
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: "set -eu\nzone=\"{{workflow.parameters.zone}}\"\ntainted=$(kubectl get nodes -l \"topology.kubernetes.io/zone=$zone\"\
        \ -o json \\\n  | jq '[.items[] | select(any(.spec.taints[]?; .key == \"chaos.litmuschaos.io/az-failure\"\
        ))] | length')\nnot_ready=$(kubectl get nodes -o json \\\n  | jq '[.items[] | select(any(.status.conditions[];\
        \ .type == \"Ready\" and .status != \"True\"))] | length')\necho \"Nodes still tainted in $zone: $tainted;\
        \ NotReady nodes: $not_ready\"\n[ \"$tainted\" -eq 0 ] && [ \"$not_ready\" -eq 0 ]\n"
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: report-results
    inputs:
      parameters:
      - name: downtime
    script:
      image: curlimages/curl:8.22.0
      command:
      - sh
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: "echo \"=== AZ Failure Test Report ===\"\necho \"Workflow: {{workflow.name}}\"\necho \"Zone: {{workflow.parameters.zone}}\"\
        \necho \"Max consecutive probe failures: {{inputs.parameters.downtime}} seconds\"\nif [ \"{{inputs.parameters.downtime}}\"\
        \ -gt \"{{workflow.parameters.max-acceptable-downtime-seconds}}\" ]; then\n  echo \"RESULT: FAIL (downtime\
        \ > {{workflow.parameters.max-acceptable-downtime-seconds}}s)\"\n  exit 1\nfi\necho \"RESULT: PASS (downtime\
        \ <= {{workflow.parameters.max-acceptable-downtime-seconds}}s)\"\n"
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  - name: cleanup
    script:
      image: alpine/k8s:1.32.13
      command:
      - sh
      env:
      - name: HOME
        value: /tmp
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CHAOS_DURATION
        value: '{{workflow.parameters.chaos-duration}}'
      - name: MAX_DOWNTIME_SECONDS
        value: '{{workflow.parameters.max-acceptable-downtime-seconds}}'
      - name: PROBE_URL
        value: '{{workflow.parameters.probe-url}}'
      - name: CLEANUP_NODE_TAINTS
        value: 'true'
      - name: PROBE_BODY
        value: '{{workflow.parameters.probe-body}}'
      - name: PROBE_RESPONSE_FILTER
        value: '{{workflow.parameters.probe-response-filter}}'
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      source: 'sh /chaos/cleanup.sh

        '
      volumeMounts:
      - name: chaos-scripts
        mountPath: /chaos
        readOnly: true
  synchronization:
    mutexes:
    - name: chaos-experiments
  volumes:
  - name: chaos-scripts
    configMap:
      name: chaos-workflow-scripts
  podMetadata:
    annotations:
      sidecar.istio.io/inject: 'false'
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/zone
            operator: Exists
          - key: topology.kubernetes.io/zone
            operator: NotIn
            values:
            - '{{workflow.parameters.zone}}'
