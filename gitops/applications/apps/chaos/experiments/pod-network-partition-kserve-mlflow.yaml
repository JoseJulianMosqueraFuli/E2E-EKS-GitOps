apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: kserve-mlflow-network-partition
  namespace: litmus
  labels:
    app.kubernetes.io/name: kserve-mlflow-network-partition
    app.kubernetes.io/component: chaos-experiment
    environment: dev
spec:
  appinfo:
    appns: models
    applabel: serving.kserve.io/inferenceservice=REPLACE_WITH_MODEL_NAME
    appkind: deployment
  engineState: stop
  jobCleanUpPolicy: delete
  chaosServiceAccount: litmus-network
  experiments:
  - name: pod-network-partition
    spec:
      components:
        env:
        - name: TOTAL_CHAOS_DURATION
          value: '300'
        - name: POLICY_TYPES
          value: egress
        - name: NAMESPACE_SELECTOR
          value: kubernetes.io/metadata.name=kube-system
        experimentAnnotations:
          environment: dev
          target-service: kserve
          phase: phase-2-network-chaos
          note: inference-independent-of-mlflow
