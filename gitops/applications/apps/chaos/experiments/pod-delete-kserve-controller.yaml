apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: kserve-controller-pod-delete
  namespace: litmus
  labels:
    app.kubernetes.io/name: kserve-controller-pod-delete
    app.kubernetes.io/component: chaos-experiment
    environment: dev
spec:
  appinfo:
    appns: kserve
    applabel: control-plane=kserve-controller-manager
    appkind: deployment
  engineState: active
  jobCleanUpPolicy: delete
  chaosServiceAccount: litmus-pod-kserve
  experiments:
  - name: pod-delete
    spec:
      components:
        env:
        - name: TOTAL_CHAOS_DURATION
          value: '60'
        - name: CHAOS_INTERVAL
          value: '10'
        - name: FORCE
          value: 'false'
        - name: PODS_AFFECTED_PERC
          value: '100'
        experimentAnnotations:
          environment: dev
          target-service: kserve
          phase: phase-1-pod-chaos
          note: control-plane-gap-expected
  annotationCheck: 'false'
