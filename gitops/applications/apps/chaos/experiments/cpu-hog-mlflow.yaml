apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: mlflow-cpu-hog
  namespace: litmus
  labels:
    app.kubernetes.io/name: mlflow-cpu-hog
    app.kubernetes.io/component: chaos-experiment
    environment: dev
spec:
  appinfo:
    appns: mlflow
    applabel: app=mlflow-server
    appkind: deployment
  engineState: active
  jobCleanUpPolicy: delete
  chaosServiceAccount: litmus-stress-mlflow
  experiments:
  - name: pod-cpu-hog
    spec:
      components:
        env:
        - name: TOTAL_CHAOS_DURATION
          value: '120'
        - name: CPU_CORES
          value: '1'
        - name: PODS_AFFECTED_PERC
          value: '50'
        experimentAnnotations:
          environment: dev
          target-service: mlflow
          phase: phase-1-resource-chaos
          note: hpa-scale-up-expected
  annotationCheck: 'false'
