apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../workflows

commonLabels:
  environment: staging

patches:
  - patch: |
      - op: replace
        path: /spec/arguments/parameters/0/value
        value: http://staging-mlflow-server.mlflow:5000
      - op: replace
        path: /spec/arguments/parameters/1/value
        value: staging-mlflow-server
    target:
      kind: WorkflowTemplate
      name: mlflow-resilience-test
