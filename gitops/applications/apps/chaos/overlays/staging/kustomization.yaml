apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ../../workflows
- ../../../../../platform
commonLabels:
  environment: staging
patches:
- patch: "- op: replace\n  path: /spec/arguments/parameters/0/value\n  value: http://staging-mlflow-server.mlflow:5000\n\
    - op: replace\n  path: /spec/arguments/parameters/1/value\n  value: staging-mlflow-server\n"
  target:
    kind: WorkflowTemplate
    name: mlflow-resilience-test
images:
- name: mlops-platform
  newName: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/mlops-staging-trainer
replacements:
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_ACCOUNT_ID
  targets:
  - select:
      kind: WorkflowTemplate
      name: mlflow-resilience-test
    fieldPaths:
    - spec.templates.[name=prepare-canary].container.image
    - spec.templates.[name=verify-canary].container.image
    options:
      delimiter: .
      index: 0
- source:
    kind: ConfigMap
    name: platform-config
    fieldPath: data.AWS_REGION
  targets:
  - select:
      kind: WorkflowTemplate
      name: mlflow-resilience-test
    fieldPaths:
    - spec.templates.[name=prepare-canary].container.image
    - spec.templates.[name=verify-canary].container.image
    options:
      delimiter: .
      index: 3
