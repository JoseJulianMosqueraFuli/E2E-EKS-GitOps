apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: litmuschaos
  namespace: litmus
spec:
  interval: 1h
  url: https://litmuschaos.github.io/litmus-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: litmus-core
  namespace: litmus
spec:
  interval: 1h
  chart:
    spec:
      chart: litmus-core
      version: "3.31.1"
      sourceRef:
        kind: HelmRepository
        name: litmuschaos
        namespace: litmus
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: litmus
            patch: |
              - op: test
                path: /rules/0/resources
                value: [replicationcontrollers, secrets]
              - op: replace
                path: /rules/0/resources
                value: [replicationcontrollers]
  values:
    operatorMode: standard
    operator:
      image:
        pullPolicy: IfNotPresent
    exporter:
      enabled: false
    policies:
      monitoring:
        disabled: true
    tolerations:
      - key: chaos.litmuschaos.io/az-failure
        operator: Exists
        effect: NoExecute
---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: kubernetes-chaos
  namespace: litmus
spec:
  interval: 1h
  dependsOn:
    - name: litmus-core
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: k8s-chaos-admin
            patch: |
              $patch: delete
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: k8s-chaos-admin
          - target:
              kind: ClusterRoleBinding
              name: k8s-chaos-admin
            patch: |
              $patch: delete
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: k8s-chaos-admin
          - target:
              kind: ServiceAccount
              name: k8s-chaos-admin
            patch: |
              $patch: delete
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: k8s-chaos-admin
  chart:
    spec:
      chart: kubernetes-chaos
      version: "3.31.0"
      sourceRef:
        kind: HelmRepository
        name: litmuschaos
        namespace: litmus
  values:
    image:
      litmusGO:
        pullPolicy: IfNotPresent
    environment:
      runtime: containerd
      socketPath: /run/containerd/containerd.sock
