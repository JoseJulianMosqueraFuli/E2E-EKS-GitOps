apiVersion: v1
kind: ServiceAccount
metadata:
  name: litmus-chaos-exporter
  namespace: litmus
  labels:
    app.kubernetes.io/name: litmus-chaos-exporter
    app.kubernetes.io/component: metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litmus-chaos-exporter
  labels:
    app.kubernetes.io/name: litmus-chaos-exporter
    app.kubernetes.io/component: metrics
rules:
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litmus-chaos-exporter
  labels:
    app.kubernetes.io/name: litmus-chaos-exporter
    app.kubernetes.io/component: metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litmus-chaos-exporter
subjects:
  - kind: ServiceAccount
    name: litmus-chaos-exporter
    namespace: litmus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litmus-chaos-exporter
  namespace: litmus
  labels:
    app.kubernetes.io/name: litmus-chaos-exporter
    app.kubernetes.io/component: metrics
    app.kubernetes.io/version: "3.31.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litmus-chaos-exporter
      app.kubernetes.io/component: metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litmus-chaos-exporter
        app.kubernetes.io/component: metrics
        app.kubernetes.io/version: "3.31.0"
    spec:
      serviceAccountName: litmus-chaos-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: chaos.litmuschaos.io/az-failure
          operator: Exists
          effect: NoExecute
      containers:
        - name: chaos-exporter
          image: litmuschaos.docker.scarf.sh/litmuschaos/chaos-exporter:3.31.0
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              value: ""
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
