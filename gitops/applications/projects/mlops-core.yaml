apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mlops-core
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Core MLOps platform applications

  sourceRepos:
    - "https://github.com/JoseJulianMosqueraFuli/E2E-EKS-GitOps.git"

  destinations:
    - namespace: mlflow
      server: https://kubernetes.default.svc
    - namespace: kubeflow
      server: https://kubernetes.default.svc
    - namespace: kserve
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: argo-workflows
      server: https://kubernetes.default.svc
    - namespace: feast
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: gatekeeper-system
      server: https://kubernetes.default.svc
    - namespace: istio-system
      server: https://kubernetes.default.svc
    - namespace: litmus
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: networking.k8s.io
      kind: IngressClass
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Secret
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: batch
      kind: CronJob
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: networking.k8s.io
      kind: Ingress
    - group: policy
      kind: PodDisruptionBudget
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: argoproj.io
      kind: WorkflowTemplate
    - group: argoproj.io
      kind: CronWorkflow
    - group: kserve.io
      kind: InferenceService
    - group: external-secrets.io
      kind: ExternalSecret
    - group: networking.istio.io
      kind: Gateway
    - group: networking.istio.io
      kind: VirtualService
    - group: networking.istio.io
      kind: DestinationRule
    - group: security.istio.io
      kind: AuthorizationPolicy
    - group: security.istio.io
      kind: PeerAuthentication
    - group: constraints.gatekeeper.sh
      kind: "*"

  roles:
    - name: mlops-admin
      description: Admin role for MLOps applications
      policies:
        - p, proj:mlops-core:mlops-admin, applications, *, mlops-core/*, allow
      groups:
        - mlops-admins

    - name: mlops-developer
      description: Developer role for MLOps applications
      policies:
        - p, proj:mlops-core:mlops-developer, applications, get, mlops-core/*, allow
        - p, proj:mlops-core:mlops-developer, applications, sync, mlops-core/*, allow
      groups:
        - mlops-developers
