apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../gitops/applications/apps/mlflow/overlays/dev

patches:
  - target:
      group: external-secrets.io
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: removed-in-kind
  - target:
      group: monitoring.coreos.com
    patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: removed-in-kind
  - target:
      group: autoscaling
      kind: HorizontalPodAutoscaler
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: removed-in-kind
  - target:
      kind: Deployment
      name: dev-mlflow-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: CronJob
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
