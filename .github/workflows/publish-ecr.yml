name: Publish platform images to ECR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Initial publishing environment (promote the same image digest afterwards)
        type: choice
        options: [dev]
        default: dev
        required: true
      platform_version:
        description: New semantic version for the platform and monitoring images
        type: string
        default: 0.1.5
        required: true

permissions:
  contents: read

concurrency:
  group: publish-ecr-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      PLATFORM_VERSION: ${{ inputs.platform_version }}
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$ROLE" && test -n "$REGION"
          [[ "$PLATFORM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/setup-buildx-action@v3
      - name: Run image tests
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile
          target: test
          push: false
          cache-from: type=gha,scope=ml-platform-test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build platform
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-trainer:${{ inputs.platform_version }}
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-trainer:sha-${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            IMAGE_REF=${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-trainer:sha-${{ github.sha }}
          cache-from: type=gha,scope=ml-platform-runtime
      - name: Build MLflow server
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile.mlflow-server
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-mlflow-server:3.17.2
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-mlflow-server:sha-${{ github.sha }}
          cache-from: type=gha,scope=mlflow-server
      - name: Build monitoring
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile.monitoring
          target: runtime
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-monitoring:${{ inputs.platform_version }}
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-monitoring:sha-${{ github.sha }}
          cache-from: type=gha,scope=ml-monitoring
      - name: Scan platform image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-trainer:sha-${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan MLflow server image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-mlflow-server:sha-${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Scan monitoring image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-monitoring:sha-${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Push scanned images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          for image in "trainer:${PLATFORM_VERSION}" "trainer:sha-${SHA}" "mlflow-server:3.17.2" "mlflow-server:sha-${SHA}" "monitoring:${PLATFORM_VERSION}" "monitoring:sha-${SHA}"; do
            docker push "${REGISTRY}/mlops-${DEPLOY_ENV}-${image}"
          done
