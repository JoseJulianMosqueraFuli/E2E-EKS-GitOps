name: Publish platform images to ECR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected deployment environment
        type: choice
        options: [dev, staging, prod]
        default: dev
        required: true
      platform_version:
        description: New semantic version for the platform and monitoring images
        type: string
        default: 0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: publish-ecr-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      PLATFORM_VERSION: ${{ inputs.platform_version }}
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$ROLE" && test -n "$REGION"
          [[ "$PLATFORM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$DEPLOY_ENV" = prod ]; then test "$GITHUB_REF" = refs/heads/main; fi
      - uses: docker/setup-buildx-action@v3
      - name: Run image tests
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile
          target: test
          push: false
          cache-from: type=gha,scope=ml-platform-test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Publish platform
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-trainer:${{ inputs.platform_version }}
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-trainer:sha-${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            IMAGE_REF=${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-trainer:sha-${{ github.sha }}
          cache-from: type=gha,scope=ml-platform-runtime
      - name: Publish MLflow server
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile.mlflow-server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-mlflow-server:2.22.5
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-mlflow-server:sha-${{ github.sha }}
          cache-from: type=gha,scope=mlflow-server
      - name: Publish monitoring
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile.monitoring
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-monitoring:${{ inputs.platform_version }}
            ${{ steps.ecr.outputs.registry }}/mlops-${{ inputs.environment }}-monitoring:sha-${{ github.sha }}
          cache-from: type=gha,scope=ml-monitoring
