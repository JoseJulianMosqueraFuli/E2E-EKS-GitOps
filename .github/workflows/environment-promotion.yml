name: Environment Promotion

on:
  push:
    branches: [develop, staging]
  workflow_dispatch:
    inputs:
      source_env:
        description: Source environment
        required: true
        type: choice
        options: [dev, staging]
      target_env:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promotion-${{ github.event.inputs.target_env || github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve promotion path
        id: promotion
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_INPUT: ${{ inputs.source_env }}
          TARGET_INPUT: ${{ inputs.target_env }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            source="$SOURCE_INPUT"
            target="$TARGET_INPUT"
          elif [[ "$REF_NAME" == "develop" ]]; then
            source=dev
            target=staging
          else
            source=staging
            target=production
          fi
          case "$source:$target" in
            dev:staging) head=develop; base=staging ;;
            staging:production) head=staging; base=main ;;
            *) echo "Invalid promotion path: $source to $target"; exit 1 ;;
          esac
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.promotion.outputs.head }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Install validation dependencies
        run: pip install pyyaml pytest hypothesis

      - name: Validate source and target configurations
        env:
          SOURCE_ENV: ${{ steps.promotion.outputs.source }}
          TARGET_ENV: ${{ steps.promotion.outputs.target }}
        run: |
          python gitops/scripts/promotion/promote.py "$SOURCE_ENV" "$TARGET_ENV" --dry-run
          python -m pytest gitops/tests/test_gitops_checkpoint.py gitops/tests/test_application_deployment_consistency.py gitops/tests/test_rendered_applications.py -q

      - name: Create or reuse promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ steps.promotion.outputs.head }}
          BASE_BRANCH: ${{ steps.promotion.outputs.base }}
        run: |
          existing="$(gh pr list --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Promotion PR already exists: #$existing"
            exit 0
          fi
          ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_BRANCH...$HEAD_BRANCH" --jq '.ahead_by')"
          if [[ "$ahead" == "0" ]]; then
            echo "No commits to promote"
            exit 0
          fi
          gh pr create --base "$BASE_BRANCH" --head "$HEAD_BRANCH" \
            --title "Promote: $HEAD_BRANCH → $BASE_BRANCH" \
            --body "Promotes the validated source branch. All application overlays were rendered and AppProject permissions checked. Production requires review and branch protection before merge."
