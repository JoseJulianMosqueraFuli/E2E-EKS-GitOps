name: E2E (kind)

on:
  push:
    branches: [main]
    paths:
      - "ml-platform/**"
      - "gitops/applications/apps/argo-workflows/**"
      - "gitops/applications/apps/mlflow/**"
      - "gitops/applications/apps/chaos/**"
      - "gitops/infrastructure/controllers/flux-system/**"
      - "gitops/scripts/install-gitops-controllers.sh"
      - "gitops/infrastructure/security/chaos-guardrails.yaml"
      - "gitops/applications/apps/kserve/**"
      - "gitops/applications/apps/model-serving/**"
      - "gitops/infrastructure/addons/cert-manager/**"
      - "gitops/infrastructure/sources/**"
      - "Makefile"
      - "scripts/e2e/**"
      - "gitops/platform/**"
      - ".github/workflows/e2e-kind.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "ml-platform/**"
      - "gitops/applications/apps/argo-workflows/**"
      - "gitops/applications/apps/mlflow/**"
      - "gitops/applications/apps/chaos/**"
      - "gitops/infrastructure/controllers/flux-system/**"
      - "gitops/scripts/install-gitops-controllers.sh"
      - "gitops/infrastructure/security/chaos-guardrails.yaml"
      - "gitops/applications/apps/kserve/**"
      - "gitops/applications/apps/model-serving/**"
      - "gitops/infrastructure/addons/cert-manager/**"
      - "gitops/infrastructure/sources/**"
      - "Makefile"
      - "scripts/e2e/**"
      - "gitops/platform/**"
      - ".github/workflows/e2e-kind.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Training, backup recovery and Chaos on kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ML platform image
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile
          target: runtime
          load: true
          tags: mlops-platform:0.1.5
          cache-from: |
            type=gha,scope=ml-platform-runtime
            type=gha,scope=ml-platform-test

      - name: Build MLflow server image
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile.mlflow-server
          load: true
          tags: mlflow-server:3.17.1
          cache-from: type=gha,scope=mlflow-server
          cache-to: type=gha,mode=max,scope=mlflow-server

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mlops-e2e
          version: v0.33.0
          kubectl_version: v1.37.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5

      - name: Create platform config from example
        run: make platform-config

      - name: Load images into kind under their ECR names
        run: |
          source gitops/platform/aws.env
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker tag mlops-platform:0.1.5 "${registry}/mlops-dev-trainer:0.1.5"
          docker tag mlflow-server:3.17.1 "${registry}/mlops-dev-mlflow-server:3.17.1"
          kind load docker-image "${registry}/mlops-dev-trainer:0.1.5" "${registry}/mlops-dev-mlflow-server:3.17.1" --name mlops-e2e

      - name: Run end-to-end smoke test
        env:
          KUBE_CONTEXT: kind-mlops-e2e
        run: make e2e-kind-smoke

      - name: Verify PostgreSQL backup and restore
        env:
          KUBE_CONTEXT: kind-mlops-e2e
        run: make e2e-kind-backup

      - name: Verify Litmus experiments and cancellation cleanup
        env:
          KUBE_CONTEXT: kind-mlops-e2e
        run: make e2e-kind-chaos

      - name: Verify model serving with KServe
        env:
          KUBE_CONTEXT: kind-mlops-e2e
        run: make e2e-kind-serve

      - name: Retain Chaos evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-kind-evidence
          path: test-results/chaos/
          retention-days: 14
          if-no-files-found: ignore

      - name: Retain serving evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serving-kind-evidence
          path: test-results/serving/
          retention-days: 14
          if-no-files-found: ignore
