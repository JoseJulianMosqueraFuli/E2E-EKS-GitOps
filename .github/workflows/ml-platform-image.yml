name: ML Platform Image

on:
  push:
    branches: [main]
    tags: ["ml-platform-v*"]
    paths:
      - "ml-platform/**"
      - ".github/workflows/ml-platform-image.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "ml-platform/**"
      - ".github/workflows/ml-platform-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-platform-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mlops-platform

jobs:
  test:
    name: Test in container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run tests (Dockerfile test stage)
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile
          target: test
          push: false
          cache-from: type=gha,scope=ml-platform-test
          cache-to: type=gha,mode=max,scope=ml-platform-test

  publish:
    name: Build and publish
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=match,pattern=ml-platform-v(.*),group=1

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: ml-platform
          file: ml-platform/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            IMAGE_REF=${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: |
            type=gha,scope=ml-platform-runtime
            type=gha,scope=ml-platform-test
          cache-to: type=gha,mode=max,scope=ml-platform-runtime
