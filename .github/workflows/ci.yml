name: CI Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      run_aws_tests:
        description: Run infrastructure tests against real AWS
        type: boolean
        default: false

env:
  AWS_REGION: us-west-2

jobs:
  # Infrastructure validation
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/

      - name: Terraform Init
        run: |
          cd infra/environments/dev
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd infra/environments/dev
          terraform validate

  # Infrastructure Tests
  # NOTE: These tests require AWS credentials to run properly
  terraform-test:
    name: Terraform Tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_aws_tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache-dependency-path: infra/modules/**/test/go.mod

      - name: Run VPC Tests
        run: |
          cd infra/modules/vpc/test
          go mod download
          go test -v -timeout 30m

      - name: Run S3 Tests
        run: |
          cd infra/modules/s3/test
          go mod download
          go test -v -timeout 20m

  # Kubernetes manifest validation
  k8s-validate:
    name: Kubernetes Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install -r gitops/tests/requirements.txt

      - name: Validate all canonical application overlays
        run: python gitops/scripts/validate_applications.py

      - name: Run GitOps regression tests
        run: python -m pytest gitops/tests/ -m "not integration" -q

  # ML Platform Tests
  ml-platform-test:
    name: ML Platform Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-platform/pyproject.toml

      - name: Install dependencies
        run: |
          cd ml-platform
          pip install -e .
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          cd ml-platform
          flake8 src/ tests/
          black --check src/ tests/

      - name: Run tests
        run: |
          cd ml-platform
          pytest tests/ -v

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        with:
          sarif_file: "trivy-results.sarif"

  # Helm Chart Validation
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Lint Helm charts
        run: |
          for chart in gitops/charts/*/; do
            echo "=== Linting $(basename "$chart") ==="
            helm dependency build "$chart"
            helm lint "$chart"
          done

      - name: Template Helm charts
        run: |
          for chart in gitops/charts/*/; do
            echo "=== Template $(basename "$chart") ==="
            helm template --debug "$chart" > /dev/null
          done

  # MLOps Stack Validation
  mlops-validate:
    name: MLOps Stack Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate setup script
        run: |
          chmod +x scripts/setup-mlops-stack.sh
          bash -n scripts/setup-mlops-stack.sh
