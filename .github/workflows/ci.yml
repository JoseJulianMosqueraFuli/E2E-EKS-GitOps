name: CI Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      run_aws_tests:
        description: Run infrastructure tests against real AWS
        type: boolean
        default: false

env:
  AWS_REGION: us-west-2

jobs:
  # Infrastructure validation
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/

      - name: Terraform Init
        run: |
          cd infra/environments/dev
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd infra/environments/dev
          terraform validate

  # Infrastructure Tests
  # NOTE: These tests require AWS credentials to run properly
  terraform-test:
    name: Terraform Tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_aws_tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache-dependency-path: infra/modules/**/test/go.mod

      - name: Run VPC Tests
        run: |
          cd infra/modules/vpc/test
          go mod download
          go test -v -timeout 30m

      - name: Run S3 Tests
        run: |
          cd infra/modules/s3/test
          go mod download
          go test -v -timeout 20m

  # Kubernetes manifest validation
  k8s-validate:
    name: Kubernetes Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install -r gitops/tests/requirements.txt

      - name: Validate all canonical application overlays
        run: python gitops/scripts/validate_applications.py

      - name: Run GitOps regression tests
        run: python -m pytest gitops/tests/ -m "not integration" -q

  # ML Platform Tests
  ml-platform-test:
    name: ML Platform Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml-platform/pyproject.toml

      - name: Install dependencies
        run: |
          cd ml-platform
          pip install -e .
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          cd ml-platform
          flake8 src/ tests/
          black --check src/ tests/

      - name: Run tests
        run: |
          cd ml-platform
          pytest tests/ -v

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        with:
          sarif_file: "trivy-results.sarif"

  # Helm Chart Validation
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Register Helm dependency repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add jetstack https://charts.jetstack.io
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Lint Helm charts
        run: |
          for chart in gitops/charts/*/; do
            echo "=== Linting $(basename "$chart") ==="
            helm dependency build "$chart"
            helm lint "$chart"
          done

      - name: Template Helm charts
        run: |
          for chart in gitops/charts/*/; do
            echo "=== Template $(basename "$chart") ==="
            helm template --debug "$chart" > /dev/null
          done

  # MLOps Stack Validation
  mlops-validate:
    name: MLOps Stack Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate setup script
        run: |
          chmod +x scripts/setup-mlops-stack.sh
          bash -n scripts/setup-mlops-stack.sh

  n8n-workflow-test:
    name: n8n Workflow Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      N8N_IMAGE: n8nio/n8n:1.120.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import and execute workflows
        shell: bash
        run: |
          set -u
          report="n8n-test-report.md"
          printf '# n8n workflow test report\n\nImage: `%s`\n\n| Workflow | Result |\n| --- | --- |\n' "$N8N_IMAGE" > "$report"

          shopt -s nullglob
          workflows=(n8n/workflows/*.json)
          if [ "${#workflows[@]}" -eq 0 ]; then
            printf '| — | FAIL (no workflow JSON files found) |\n' >> "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          passed=0
          failed=0
          for workflow in "${workflows[@]}"; do
            workflow_id=$(jq -er '.id | select(type == "string" and length > 0)' "$workflow" 2>/dev/null || true)
            if [[ ! "$workflow_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
              printf '| `%s` | FAIL (missing workflow ID) |\n' "$(basename "$workflow")" >> "$report"
              failed=$((failed + 1))
              continue
            fi

            log_file="$RUNNER_TEMP/n8n-workflow-$((passed + failed + 1)).log"
            if docker run --rm \
              --network none \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --memory 1g \
              --cpus 1 \
              --pids-limit 256 \
              --env N8N_DIAGNOSTICS_ENABLED=false \
              --env N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true \
              --volume "$(realpath "$workflow"):/tmp/workflow.json:ro" \
              --entrypoint /bin/sh \
              "$N8N_IMAGE" \
              -c 'n8n import:workflow --input=/tmp/workflow.json && n8n execute --id="$1"' \
              n8n-test "$workflow_id" \
              >"$log_file" 2>&1; then
              printf '| `%s` | PASS |\n' "$(basename "$workflow")" >> "$report"
              passed=$((passed + 1))
            else
              printf '| `%s` | FAIL (import or execution returned a non-zero exit code) |\n' "$(basename "$workflow")" >> "$report"
              tail -n 40 "$log_file"
              failed=$((failed + 1))
            fi
          done

          printf '\n**Result:** %s passed, %s failed.\n' "$passed" "$failed" >> "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"
          [ "$failed" -eq 0 ]

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-workflow-test-report
          path: n8n-test-report.md
          if-no-files-found: ignore
