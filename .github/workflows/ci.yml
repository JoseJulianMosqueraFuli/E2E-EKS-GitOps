name: CI Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      run_aws_tests:
        description: Run infrastructure tests against real AWS
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1

jobs:
  # Infrastructure validation
  terraform-validate:
    name: Terraform Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Terraform Format Check
        run: make terraform-fmt-check

      - name: Terraform Validate
        run: make validate-terraform ENV=${{ matrix.environment }}

  # Infrastructure Tests
  # NOTE: These tests require AWS credentials to run properly
  terraform-test:
    name: Terraform Tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_aws_tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache-dependency-path: infra/modules/**/test/go.mod

      - name: Run VPC Tests
        run: |
          cd infra/modules/vpc/test
          go mod download
          go test -v -timeout 30m

      - name: Run S3 Tests
        run: |
          cd infra/modules/s3/test
          go mod download
          go test -v -timeout 20m

  # Kubernetes manifest validation
  k8s-validate:
    name: Kubernetes Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.5.1"

      - name: Install GitOps dependencies
        run: cd gitops && poetry install --with test,dev

      - name: Create platform config from example
        run: make platform-config

      - name: Validate all canonical application overlays
        run: cd gitops && poetry run python scripts/validate_applications.py

      - name: Check AWS account/region placeholders are resolved
        run: make validate-platform-config

      - name: Run GitOps regression tests
        run: cd gitops && poetry run pytest tests/ -m "not integration" -q

  # ML Platform Tests
  ml-platform-test:
    name: ML Platform Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.5.1"

      - name: Install dependencies
        run: |
          cd ml-platform
          poetry install -E dev

      - name: Run linting
        run: |
          cd ml-platform
          poetry run flake8 src/ tests/
          poetry run black --check src/ tests/

      - name: Run tests
        run: |
          cd ml-platform
          poetry run pytest tests/ -v

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        with:
          sarif_file: "trivy-results.sarif"

  # Helm Chart Validation
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Register Helm dependency repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add jetstack https://charts.jetstack.io
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Lint Helm charts
        run: |
          for chart in gitops/charts/*/; do
            echo "=== Linting $(basename "$chart") ==="
            helm dependency build "$chart"
            helm lint "$chart"
          done

      - name: Template Helm charts
        run: |
          for chart in gitops/charts/*/; do
            echo "=== Template $(basename "$chart") ==="
            helm template --debug "$chart" > /dev/null
          done

  # MLOps Stack Validation
  mlops-validate:
    name: MLOps Stack Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate setup script
        run: |
          chmod +x scripts/setup-mlops-stack.sh
          bash -n scripts/setup-mlops-stack.sh
