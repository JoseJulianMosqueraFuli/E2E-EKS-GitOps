version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directories:
      - "/ml-platform"
      - "/gitops"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directories:
      - "/infra/modules/*/test"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(terratest)"
    groups:
      terratest:
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directories:
      - "/infra/environments/*"
      - "/infra/modules/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(terraform)"
    groups:
      terraform:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/ml-platform"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
