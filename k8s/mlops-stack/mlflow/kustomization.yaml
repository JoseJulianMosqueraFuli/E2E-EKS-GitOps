apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Single source of truth is in gitops/applications/apps/mlflow/ (dev overlay: AWS values from gitops/platform/aws.env)
resources:
  - ../../../gitops/applications/apps/mlflow/overlays/dev

labels:
  - pairs:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: mlops-mlflow
      app.kubernetes.io/version: "2.22.5"
      app.kubernetes.io/component: ml-platform
      app.kubernetes.io/part-of: mlops-platform
    includeSelectors: true

configMapGenerator:
  - name: mlflow-environment-config
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=INFO
      - MLFLOW_VERSION=2.22.5
